<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fernando Anel</title>

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            padding: 40px;
            max-width: 900px;
        }

        h1 {
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 700;
            margin-bottom: 20px;
        }

        h2 {
            font-size: clamp(1.4rem, 4vw, 2rem);
            font-weight: 300;
            margin-bottom: 15px;
            color: #dbeafe;
        }

        .colegiado {
            font-size: clamp(1.1rem, 2.5vw, 1.3rem);
            color: #bfdbfe;
            margin-bottom: 50px;
        }

        .contacto {
            border-top: 1px solid rgba(255,255,255,.25);
            padding-top: 25px;
            font-size: 1rem;
        }

        .contacto p {
            margin-bottom: 18px;
            color: #e2e8f0;
            font-weight: 600;
        }

        .contacto a {
            color: #bfdbfe;
            text-decoration: none;
            margin: 0 12px;
            transition: color .3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .contacto a:hover {
            color: #ffffff;
        }

        .contacto i {
            font-size: 1.2rem;
        }

        @media (max-width: 600px) {
            .contacto a {
                display: block;
                margin: 12px 0;
            }
        }
.logo-coitt {
    margin: 30px 0 40px;
}

.logo-coitt img {
    max-width: 280px;
    width: 100%;
    height: auto;
    transition: transform .3s ease, opacity .3s ease;
}

.logo-coitt img:hover {
    transform: scale(1.05);
    opacity: 0.9;
}
    </style>
</head>
<body>

<div class="container">

<div class="logo-coitt">

    </a>
</div>

            LinkedIn

</div>
